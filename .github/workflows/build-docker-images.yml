name: Build and Push CI Docker Images

on:
    push:
        branches:
            - master
        paths:
            - 'Dockerfile.alpine'
            - 'Dockerfile.arch'
            - 'entrypoint.sh'
    pull_request:
        paths:
            - 'Dockerfile.alpine'
            - 'Dockerfile.arch'
            - 'entrypoint.sh'
    release:
        types: [published]
    workflow_dispatch:

env:
    REGISTRY: ghcr.io

jobs:
    build-and-push:
        name: "Build and Push (${{ matrix.distro }})"
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        
        strategy:
            fail-fast: false
            matrix:
                include:
                    - distro: arch
                      file: Dockerfile.arch
                      image_name: nyx-ci-arch
                    - distro: alpine
                      file: Dockerfile.alpine
                      image_name: nyx-ci-alpine
            
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Acquire yesterday's date (for Arch Snapshot)
              id: archive_date
              run: echo "date=$(date -d 'yesterday' '+%Y/%m/%d')" >> $GITHUB_OUTPUT
            
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log into Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                registry: ${{ env.REGISTRY }}
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker Metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}
                tags: |
                    type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
                    type=sha,prefix=sha-,format=short
                    type=ref,event=branch
                    type=semver,pattern={{version}}
                
            - name: Build and Push Docker Image
              uses: docker/build-push-action@v6
              with:
                context: .
                file: ${{ matrix.file }}
                platforms: linux/amd64,linux/arm64
                push: ${{ github.event_name != 'pull_request' }}
                tags: ${{ steps.meta.outputs.labels }}
                build-args: |
                    PACMAN_DATE=${{ steps.archive_date.outputs.date }}
                cache-from: type=gha,scope=${{ matrix.distro }}
                cache-to: type=gha,mode=max,scope=${{ matrix.distro }}